<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sTrack 2.1 — simply handle IT Track</title>
<meta name="description" content="sTrack (simply handle IT Track) — offline Gantt, agile board, sprints, timesheet and reports. Nothing is uploaded; a team can share one database file.">
<link rel="icon" id="favicon">
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI Variable","SF Pro Text","Inter","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
  --display:"Segoe UI Variable Display","SF Pro Display","Inter Display","Inter","Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  --accent:#4f46e5;--accent-2:#7c3aed;--accent-soft:rgba(79,70,229,.09);--accent-line:rgba(79,70,229,.35);
  --chrome:rgba(255,255,255,.78);--chrome-solid:#ffffff;--line:rgba(15,23,42,.07);--line-2:rgba(15,23,42,.13);
  --text:#0f172a;--muted:#667085;--hover:rgba(15,23,42,.045);--field:#ffffff;
  --canvas:#f3f4f9;--glow:rgba(124,58,237,.10);--hi:rgba(255,255,255,.9);
  --shadow:0 1px 1px rgba(15,23,42,.04),0 10px 30px -8px rgba(30,27,75,.14);
  --ok:#059669;--danger:#dc2626;color-scheme:light;
}
[data-theme=dark]{
  --accent:#818cf8;--accent-2:#a78bfa;--accent-soft:rgba(129,140,248,.15);--accent-line:rgba(129,140,248,.45);
  --chrome:rgba(24,26,33,.80);--chrome-solid:#181a21;--line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.13);
  --text:#e8eaf0;--muted:#98a1b3;--hover:rgba(255,255,255,.055);--field:#11131a;
  --canvas:#0d0f14;--glow:rgba(129,140,248,.12);--hi:rgba(255,255,255,.06);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px -10px rgba(0,0,0,.6);
  --ok:#34d399;--danger:#f87171;color-scheme:dark;
}
[data-theme=starry]{
  --accent:#8cc8ff;--accent-2:#4f7fe0;--accent-soft:rgba(140,200,255,.14);--accent-line:rgba(140,200,255,.45);
  --chrome:rgba(12,24,58,.84);--chrome-solid:#0c1a3d;--line:rgba(160,190,255,.12);--line-2:rgba(160,190,255,.22);
  --text:#e8ecff;--muted:#9fb0d6;--hover:rgba(160,190,255,.08);--field:#0a1430;
  --canvas:#0a1530;--glow:rgba(140,200,255,.10);--hi:rgba(200,220,255,.07);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px -10px rgba(0,0,0,.6);
  --ok:#7dd3fc;--danger:#fca5a5;color-scheme:dark;
  --canvas-tex:radial-gradient(1.3px 1.3px at 20% 30%,rgba(255,255,255,.55) 60%,transparent 100%) 0 0/83px 79px,radial-gradient(1.1px 1.1px at 65% 70%,rgba(200,225,255,.45) 60%,transparent 100%) 0 0/127px 109px,radial-gradient(1px 1px at 40% 55%,rgba(200,215,255,.42) 60%,transparent 100%) 0 0/61px 67px;
}
[data-theme=forest]{
  --accent:#2f6b3a;--accent-2:#5c8f3c;--accent-soft:rgba(47,107,58,.10);--accent-line:rgba(47,107,58,.4);
  --chrome:rgba(250,248,240,.86);--chrome-solid:#f8f5ec;--line:rgba(47,90,54,.11);--line-2:rgba(47,90,54,.22);
  --text:#1f3324;--muted:#5f7363;--hover:rgba(47,90,54,.06);--field:#fffdf6;
  --canvas:#e3ebdc;--glow:rgba(92,143,60,.12);--hi:rgba(255,255,250,.9);
  --shadow:0 1px 1px rgba(31,51,36,.05),0 10px 30px -8px rgba(31,51,36,.18);
  --ok:#2f6b3a;--danger:#b4413a;color-scheme:light;
  --canvas-tex:radial-gradient(ellipse 50% 40% at 95% 100%,rgba(47,107,58,.14),transparent 70%);
}
[data-theme=burning]{
  --accent:#ff7a33;--accent-2:#ee0979;--accent-soft:rgba(255,122,51,.14);--accent-line:rgba(255,122,51,.45);
  --chrome:rgba(28,18,14,.86);--chrome-solid:#1c120e;--line:rgba(255,140,80,.12);--line-2:rgba(255,140,80,.22);
  --text:#f7e9df;--muted:#c4a796;--hover:rgba(255,140,80,.075);--field:#140c09;
  --canvas:#150e0b;--glow:rgba(255,106,0,.12);--hi:rgba(255,200,160,.06);
  --shadow:0 1px 1px rgba(0,0,0,.35),0 14px 36px -10px rgba(0,0,0,.65);
  --ok:#fbbf24;--danger:#fb7185;color-scheme:dark;
  --canvas-tex:radial-gradient(ellipse 70% 45% at 50% 115%,rgba(255,106,0,.22),transparent 60%);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.45 var(--font);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 420px at 8% -8%,var(--glow),transparent 62%),radial-gradient(900px 380px at 100% 0%,var(--glow),transparent 60%),var(--canvas-tex,none),var(--canvas)}
#app{position:relative;height:100vh}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--chrome);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
.solid{background:var(--chrome-solid);border:1px solid var(--line);box-shadow:var(--shadow)}

/* toolbar */
header{position:absolute;z-index:8;top:14px;left:14px;right:14px;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-radius:18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:10px;white-space:nowrap}
.brand b{font:650 15px/1 var(--display);letter-spacing:-.015em}
.brand small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.logo{width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(10,23,54,.35))}
.tb{display:flex;align-items:center;gap:2px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line);height:28px}
button.b{height:34px;border:1px solid transparent;background:none;border-radius:10px;padding:0 11px;font:inherit;font-weight:550;color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;line-height:1;transition:background .14s,color .14s,border-color .14s,box-shadow .14s}
button.b:hover{background:var(--hover)}
button.b.on{background:var(--accent-soft);color:var(--accent)}
button.b.ico{width:34px;padding:0;justify-content:center}
button.b.sm{height:30px;padding:0 9px;font-size:12.5px}
button.b.line{border-color:var(--line-2)}
button.b svg{width:17px;height:17px;flex:none;stroke-width:1.8}
button.b:disabled{opacity:.3;cursor:default;background:none}
button.b.primary{color:#fff;padding:0 15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
button.b.primary:hover{filter:brightness(1.07)}
button.b.danger{color:var(--danger)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--hover);border:1px solid var(--line)}
.seg button{height:28px;border:0;background:none;border-radius:9px;padding:0 11px;font:inherit;font-weight:550;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,box-shadow .15s}
.seg button svg{width:15px;height:15px;stroke-width:1.9}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--chrome-solid);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 var(--hi)}
#tabs button{height:32px;padding:0 13px}
.spacer{flex:1;min-width:8px}
#dbPill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:none;color:var(--text);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;max-width:260px}
#dbPill span{overflow:hidden;text-overflow:ellipsis}
#dbPill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
#dbPill.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
#dbPill.busy i{background:var(--accent);animation:pulse 1s infinite}
#dbPill.err i{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

/* hero */
#hero{position:absolute;z-index:6;top:78px;left:14px;right:14px;height:80px;border-radius:18px;display:flex;align-items:center;gap:30px;padding:0 24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
#hero::-webkit-scrollbar{display:none}
.pblock{min-width:260px;flex:1 1 auto}
#title{display:block;width:100%;max-width:560px;border:0;border-radius:8px;margin-left:-6px;padding:1px 6px;font:650 22px/1.2 var(--display);letter-spacing:-.02em;color:var(--text);background:none}
#title:hover{background:var(--hover)}#title:focus{outline:none;background:var(--field);box-shadow:0 0 0 3px var(--accent-soft)}
.pmeta{display:flex;align-items:center;gap:16px;margin-top:6px;color:var(--muted);font-size:12.5px}
.pmeta label{display:flex;align-items:center;gap:7px}
.pmeta input,.fieldin{height:28px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;font:inherit;color:var(--text);background:var(--field);font-variant-numeric:tabular-nums}
.pmeta input:focus,.fieldin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#pTarget{width:58px;text-align:right}
.kpis{display:flex;gap:28px;flex:none}
.kpi{display:flex;flex-direction:column;gap:5px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font:600 19px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b small{font:500 12px var(--font);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi.warn b{color:var(--danger)}
.ringbox{display:flex;align-items:center;gap:13px;flex:none;padding-left:26px;border-left:1px solid var(--line)}
.ring{position:relative;width:56px;height:56px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:650 14px var(--display);font-variant-numeric:tabular-nums}
.ring circle.v{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.rtext{display:flex;flex-direction:column;gap:6px}
.rtext span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-weight:600;font-size:12px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chip.mid{background:var(--hover);color:var(--muted)}

/* views */
.view{position:absolute;z-index:1;top:166px;left:14px;right:14px;bottom:14px}
.vbar{height:48px;border-radius:15px;display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.vbar::-webkit-scrollbar{display:none}
.vbar .lab{color:var(--muted);font-size:12.5px;margin:0 4px 0 8px}
.vbody{position:absolute;top:56px;left:0;right:0;bottom:0;border-radius:18px;overflow:hidden}
.vscroll{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#zoomLbl{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

/* gantt panes */
#gwrap{display:flex}
#lp{flex:none;display:flex;flex-direction:column;min-width:0;background:var(--chrome-solid)}
#rp{flex:1;display:flex;flex-direction:column;min-width:0}
#lhead,#rhead{flex:none;height:52px;overflow:hidden;background:var(--chrome-solid);border-bottom:1px solid var(--line-2)}
#lbody{flex:1;overflow-x:scroll;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#rbody{flex:1;overflow:scroll;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#rhead{cursor:pointer}
#rhead svg,#rbody svg{display:block}
#split{flex:none;width:7px;cursor:col-resize;background:var(--chrome-solid);border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);position:relative;z-index:3}
#split::after{content:"";position:absolute;left:2px;top:50%;width:1px;height:28px;margin-top:-14px;box-shadow:0 0 0 .5px var(--muted),2px 0 0 .5px var(--muted);opacity:.6}
#split:hover,#split.drag{background:var(--accent-soft)}
.thr{display:grid;grid-template-columns:var(--cols);height:52px;align-items:end;width:var(--tw)}
.th{position:relative;padding:0 9px 10px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none;height:100%;display:flex;align-items:flex-end}
.th.r{justify-content:flex-end}
.th:hover{color:var(--text)}
.th.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.th .rz{position:absolute;right:0;top:12px;bottom:8px;width:7px;cursor:col-resize}
.th .rz::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:1px;background:var(--line-2)}
.th .rz:hover::after{background:var(--accent);width:2px}
#tlist{width:var(--tw)}
.tr{display:grid;grid-template-columns:var(--cols);height:var(--rh);border-bottom:1px solid var(--line);align-items:stretch;transition:background .12s}
.tr.sum{background:color-mix(in srgb,var(--text) 2.6%,transparent)}
.tr:hover{background:var(--hover)}
.tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tr.sum .nm1,.tr.sum .nm2{font-weight:650}
.c{min-width:0;display:flex;align-items:center;position:relative}
.c input,.c select{width:100%;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font:inherit;padding:0 8px;outline:none;min-width:0;font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s}
.c select{appearance:none;-webkit-appearance:none;cursor:pointer}
.c input:hover,.c select:hover{border-color:var(--line-2)}
.c input:focus,.c select:focus{background:var(--field);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.c input::placeholder{color:var(--muted);opacity:.75}
.c input.dt{font-size:12.5px}
.c input[type=number]{-moz-appearance:textfield;appearance:textfield;text-align:right}
.c input::-webkit-inner-spin-button,.c input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.c.ro{padding:0 9px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;justify-content:flex-end;white-space:nowrap;overflow:hidden}
.c.ro.l{justify-content:flex-start}
.c.n{justify-content:center;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;user-select:none;cursor:pointer}
.c.pct::before,.c.pct::after{content:"";position:absolute;left:9px;bottom:5px;height:3px;border-radius:2px;pointer-events:none}
.c.pct::before{right:9px;background:var(--line-2)}
.c.pct::after{width:calc((100% - 18px) * var(--pp));background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.c.pct input{height:26px;margin-bottom:6px}
.c.pct.ro{padding-bottom:6px}
.c.name{gap:0}
.names{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.names input{height:24px}
.both .names input{height:23px}
.names .nm2{font-size:12.5px;color:var(--muted)}
.names .nm2:focus{color:var(--text)}
.car,.car0{flex:none;width:20px;height:24px;display:grid;place-items:center;color:var(--muted)}
.car{border:0;background:none;cursor:pointer;border-radius:6px;padding:0}
.car svg{width:12px;height:12px;transition:transform .18s}
.car.f svg{transform:rotate(-90deg)}
.car:hover{background:var(--hover);color:var(--text)}
.car0 svg{width:13px;height:13px}
.planning{font-style:italic}
.stsel{font-weight:600;font-size:12px!important}
.stdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.c.st{padding-left:8px}
.c.st select{padding-left:0}
.pics{display:flex;align-items:center;gap:3px;padding:0 6px;width:100%;height:30px;border-radius:8px;cursor:pointer;overflow:hidden;border:1px solid transparent}
.pics:hover{border-color:var(--line-2)}
.pics .ph{color:var(--muted);opacity:.7;font-size:12px}
.av{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 0 0 2px var(--chrome-solid);text-transform:uppercase}
.pics .av+.av{margin-left:-7px}
.pics .pn{font-size:12px;margin-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 22px;color:var(--muted);text-align:center;line-height:1.6}
.empty b{display:block;font:600 16px var(--display);color:var(--text);margin-bottom:4px}
.empty button{margin-top:14px}
#legend{position:absolute;z-index:4;right:22px;bottom:22px;display:flex;gap:14px;align-items:center;padding:7px 12px;border-radius:12px;font-size:11.5px;color:var(--muted);pointer-events:none}
#legend i{display:inline-block;width:18px;height:8px;border-radius:4px;vertical-align:-1px;margin-right:6px}

/* popovers, menus, modals */
.pop{position:absolute;z-index:30;padding:16px 18px;border-radius:16px;max-height:calc(100vh - 90px);overflow:auto;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}}
#setPop{width:380px}#themePop{width:350px}#helpPop{width:460px}#picPop{width:280px;padding:10px}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.phead b{font:650 15px var(--display);letter-spacing:-.01em}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;width:28px;height:28px;font-size:17px;line-height:1;flex:none}
.xbtn:hover{background:var(--hover);color:var(--text)}
.pnote{font-size:12px;color:var(--muted);margin:8px 0;line-height:1.5;white-space:normal}
.ph2{font-weight:600;font-size:12px;color:var(--muted);margin:16px 0 8px}
.fld{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fld>span{flex:1}
.fld input[type=number],.fld input[type=text],.fld input[type=date],.fld select,.hadd input,.hrow input,.fgrid input,.fgrid select,.fgrid textarea{height:32px;border:1px solid var(--line-2);border-radius:9px;padding:0 9px;font:inherit;color:var(--text);background:var(--field)}
.fld input[type=number]{width:84px;text-align:right}
.fld input[type=text]{width:140px}
input:focus,select:focus,textarea:focus{outline:none}
.fld input:focus,.hadd input:focus,.hrow input:focus,.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input[type=checkbox],.fld input[type=radio],.ck input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.hlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.hrow{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;align-items:center;padding:5px 6px 5px 10px;border-bottom:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.hrow:last-child{border-bottom:0}
.hrow input{height:28px;min-width:0;border-color:transparent;background:none}
.hrow small{color:var(--muted);margin-left:3px}
.hadd{display:grid;grid-template-columns:136px 1fr auto;gap:6px;margin-top:10px}
.hadd input{min-width:0}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.thcard{border:1.5px solid var(--line-2);border-radius:13px;padding:7px;background:none;cursor:pointer;text-align:left;font:inherit;color:var(--text);transition:border-color .14s,box-shadow .14s}
.thcard:hover{border-color:var(--accent-line)}
.thcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thcard .prev{height:52px;border-radius:9px;position:relative;overflow:hidden;margin-bottom:7px}
.thcard .prev i{position:absolute;border-radius:4px}
.thcard b{font-size:12.5px;font-weight:600}.thcard .pnote{margin:1px 0 0}
.kbd{font:600 11px ui-monospace,"Cascadia Code",Consolas,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--field);white-space:nowrap}
#helpPop table{border-collapse:collapse;width:100%;font-size:12.5px}
#helpPop td{padding:7px 2px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
#helpPop tr:last-child td{border-bottom:0}
#helpPop td:first-child{white-space:nowrap;padding-right:14px;font-weight:600}
.menu{position:fixed;z-index:40;min-width:210px;padding:5px;border-radius:12px;animation:pop .12s}
.menu button,.menu label{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--text);font:inherit;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu label:hover{background:var(--accent-soft)}
.menu button svg{width:15px;height:15px;stroke-width:1.9;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);font-weight:600}
.menu input{accent-color:var(--accent)}
.menu kbd{margin-left:auto;font:11px var(--font);color:var(--muted)}
.mback{position:fixed;inset:0;z-index:35;background:rgba(8,10,20,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;border-radius:20px;padding:20px 22px;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(1180px,calc(100vw - 28px))}
.modal h2{margin:0;font:650 18px var(--display);letter-spacing:-.015em}
.modal .sub{color:var(--muted);margin:4px 0 14px;font-size:12.5px;line-height:1.5}
.mfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:14px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--accent-line)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt input{accent-color:var(--accent);margin-top:2px}
.opt b{display:block;font-weight:600}.opt span{color:var(--muted);font-size:12.5px}
.opt .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:7px;margin-right:14px;cursor:pointer}
.fgrid{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;align-items:center}
.fgrid>label{color:var(--muted);font-size:12.5px}
.fgrid textarea{height:64px;padding:7px 9px;resize:vertical}
.fgrid input,.fgrid select{width:100%}
.picl{max-height:300px;overflow:auto}
.picl label{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer}
.picl label:hover{background:var(--hover)}
.picl input{accent-color:var(--accent)}
.tsel{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.tsel label{display:flex;align-items:center;gap:9px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.tsel label:last-child{border-bottom:0}
.tsel label.sum{font-weight:650}
.tsel input{accent-color:var(--accent);width:15px;height:15px}
.tsel small{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.preview{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:62vh;background:var(--canvas)}
.preview img,.preview svg{display:block;max-width:100%;height:auto}
#toast{position:fixed;z-index:60;left:50%;bottom:30px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--chrome-solid);color:var(--text);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:12px;padding:10px 16px;transition:opacity .2s,transform .2s;font-weight:550;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#snip{position:fixed;inset:0;z-index:50;cursor:crosshair;background:rgba(8,10,20,.32)}
#snip .rect{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(8,10,20,.32),0 0 0 1px rgba(0,0,0,.4);background:transparent}
#snip .hint{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:var(--chrome-solid);color:var(--text);padding:9px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:550;pointer-events:none}
#snip.drawing{background:transparent}
.flash{position:fixed;z-index:61;border-radius:10px;box-shadow:0 0 0 3px var(--accent),var(--shadow);pointer-events:none;animation:flash .9s forwards;background-size:cover}
@keyframes flash{0%{opacity:1}70%{opacity:1;transform:scale(.98)}100%{opacity:0;transform:scale(.9)}}

/* board */
.board{display:flex;gap:12px;padding:14px;min-height:100%;align-items:flex-start;width:max-content}
.col{width:282px;flex:none;border-radius:16px;background:color-mix(in srgb,var(--text) 3%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;max-height:100%}
.col.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:650}
.colh small{margin-left:auto;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:8px;padding:4px 10px 12px;min-height:60px}
.card{background:var(--chrome-solid);border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;transition:box-shadow .14s,transform .14s}
.card:hover{box-shadow:var(--shadow)}
.card.drag{opacity:.45}
.card .t1{font-weight:600;line-height:1.35}
.card .t2{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
.card .meta{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px;gap:8px;margin-top:9px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.card .meta span{white-space:nowrap}.card .meta .avs{margin-left:auto;display:flex}
.card .meta .avs .av{width:20px;height:20px;font-size:9px}
.card .meta .avs .av+.av{margin-left:-6px}
.card .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.card .tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--hover);font-size:11px;color:var(--muted)}
.card .tag.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

/* sprint, team, timesheet, report */
.split2{display:grid;grid-template-columns:290px 1fr;gap:14px;height:100%}
.panel{border-radius:18px;overflow:auto;padding:16px 18px}
.panel h3{margin:0 0 10px;font:650 15px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sitem{border:1.5px solid var(--line-2);border-radius:13px;padding:10px 12px;cursor:pointer;background:none;text-align:left;font:inherit;color:var(--text)}
.sitem:hover{border-color:var(--accent-line)}
.sitem.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sitem b{display:block;font-weight:600}
.sitem span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sitem .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:8px;overflow:hidden}
.sitem .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.shead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.shead input.big{font:650 18px var(--display);border:0;background:none;color:var(--text);padding:2px 6px;border-radius:8px;margin-left:-6px;min-width:200px}
.shead input.big:hover{background:var(--hover)}
.shead input.big:focus{background:var(--field);box-shadow:0 0 0 3px var(--accent-soft)}
.shead label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px}
.chartbox{border:1px solid var(--line);border-radius:14px;background:var(--chrome-solid);padding:8px;margin-bottom:14px}
.chartbox svg{display:block;width:100%;height:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.grid th{position:sticky;top:0;z-index:1;background:var(--chrome-solid);text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:10px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.grid th.r,table.grid td.r{text-align:right}
table.grid td{padding:3px 8px;border-bottom:1px solid var(--line);height:40px;font-variant-numeric:tabular-nums}
table.grid tr:hover td{background:var(--hover)}
table.grid input,table.grid select{width:100%;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font:inherit;padding:0 8px;font-variant-numeric:tabular-nums}
table.grid input:hover,table.grid select:hover{border-color:var(--line-2)}
table.grid input:focus,table.grid select:focus{background:var(--field);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
table.grid input[type=number]{text-align:right;-moz-appearance:textfield;appearance:textfield}
table.grid input::-webkit-inner-spin-button{-webkit-appearance:none}
table.grid input[type=color]{width:30px;height:26px;padding:2px;cursor:pointer}
table.grid input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
table.grid .muted{color:var(--muted)}
table.grid td.we,table.grid th.we{background:color-mix(in srgb,var(--text) 3.5%,transparent)}
table.grid td.today,table.grid th.today{box-shadow:inset 0 2px 0 var(--danger)}
table.grid tfoot td{font-weight:650;border-bottom:0;border-top:1px solid var(--line-2)}
table.grid td.over{color:var(--danger)}
table.grid .tn{display:flex;flex-direction:column;line-height:1.3;padding:3px 0}
table.grid .tn small{color:var(--muted)}
.ts input{width:62px!important;text-align:right}
.repwrap{padding:16px;min-width:1040px}
.repwrap svg{display:block;width:100%;height:auto}

/* Sutora */
#sutora{position:fixed;right:22px;bottom:20px;z-index:34;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#sutora>*{pointer-events:auto}
#stBtn{width:58px;height:58px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 8px 18px rgba(124,58,237,.38));transition:transform .15s,filter .2s,opacity .2s;position:relative}
#stBtn svg{width:58px;height:58px;display:block}
#stBtn:hover{transform:translateY(-2px) scale(1.04)}
#stBtn.off{filter:grayscale(1) drop-shadow(0 4px 10px rgba(0,0,0,.2));opacity:.72}
#stBtn.off::after{content:"z z";position:absolute;right:-6px;top:-8px;font:700 12px var(--display);color:var(--muted);letter-spacing:1px}
#stBtn .stName{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--chrome-solid);color:var(--text);padding:1px 8px;border-radius:99px;border:1px solid var(--line-2);white-space:nowrap}
#stCard{width:340px;border-radius:18px;padding:12px 14px 14px;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
#stCard.wide{width:410px}
.sthead{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.sthead .stav svg{width:26px;height:26px;display:block}
.sthead b{font:650 14px var(--display)}
.sthead select{height:26px;border:1px solid var(--line-2);border-radius:8px;background:var(--field);color:var(--text);font:inherit;font-size:12px;padding:0 4px;max-width:140px}
.stmsg{background:var(--accent-soft);border-radius:14px 14px 14px 4px;padding:10px 12px;line-height:1.55;font-size:13px}
.stact{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.stmore{margin-left:auto;color:var(--muted);font-size:11.5px}
.wtitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}.wtitle b{font:650 14px var(--display)}.wtitle small{color:var(--muted)}
.wbody{margin-top:10px}
.wgrid{display:grid;grid-template-columns:140px 1fr;gap:6px 8px;align-items:center;font-size:12.5px;margin-top:6px}.wgrid label{color:var(--muted)}
.wgrid input,.wgrid select,.wrow input{height:30px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;font:inherit;background:var(--field);color:var(--text);min-width:0}
.wgrid input:focus,.wrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.wrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.wrow input{flex:1}
.wchips{display:flex;flex-wrap:wrap;gap:6px}.wchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:var(--hover);font-size:12px}.wchip small{color:var(--muted)}
.wfoot{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.wdots{display:flex;gap:5px}.wdot{width:9px;height:9px;border-radius:50%;border:0;background:var(--line-2);padding:0;cursor:pointer}.wdot.ok{background:color-mix(in srgb,var(--ok) 60%,transparent)}.wdot.on{background:var(--accent);transform:scale(1.3)}
.wok{color:var(--ok);font-weight:700}
.spot{animation:spot 2.5s ease-out;border-radius:8px}
@keyframes spot{0%,65%{box-shadow:0 0 0 3px var(--accent),0 0 0 9px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.tplmodels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tplmodels .sitem{width:205px}
.modal.xwide{width:min(1440px,calc(100vw - 28px))}
.tplwrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.tpltable table{min-width:900px}.tpltable td:nth-child(2) input{min-width:200px}.tpltable td:nth-child(3) input{min-width:180px}.tpltable select{min-width:84px}.tpltable td:nth-child(8) select{min-width:150px}
.tstart{display:inline-flex;align-items:center;gap:7px}
.tplwrap:not(:has(.vprev)){grid-template-columns:1fr}
.tpltable{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding-bottom:6px}
.tpltable td{height:36px;padding:2px 4px}
.tpltable tr.off td{opacity:.45}
.tpltable input.ph1{font-weight:650}
.tact{white-space:nowrap}.tact .xbtn{width:22px;height:24px;font-size:13px}
.vprev{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--chrome-solid)}
.tplopts{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin-top:12px}
@media (max-width:1100px){.lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header class="glass">
  <div class="brand"><span class="logo"><svg width="34" height="34" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="tkBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14295a"/><stop offset=".55" stop-color="#0a1736"/><stop offset="1" stop-color="#050c1e"/></linearGradient><linearGradient id="tkRoute" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3b5fa6"/><stop offset=".55" stop-color="#5b7fc2"/><stop offset="1" stop-color="#b4c5e3"/></linearGradient><linearGradient id="tkS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eefc"/><stop offset="1" stop-color="#9fb4dc"/></linearGradient><radialGradient id="tkGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tkBg)"/><rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/><path d="M40 22v80M64 22v80M88 22v58" stroke="#b4c5e3" stroke-opacity=".13" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="22" y="24" width="30" height="9" rx="4.5" fill="#33549a" opacity=".55"/><rect x="46" y="47" width="34" height="9" rx="4.5" fill="#33549a" opacity=".55"/><path d="M24 90C42 90 44 64 62 64S84 38 102 36" fill="none" stroke="url(#tkRoute)" stroke-width="7" stroke-linecap="round"/><circle cx="24" cy="90" r="6" fill="#5b7fc2"/><circle cx="62" cy="64" r="6" fill="#8098c6"/><circle cx="102" cy="36" r="16" fill="url(#tkGlow)"/><circle cx="102" cy="36" r="8.5" fill="#0a1736" stroke="#b4c5e3" stroke-width="3.5"/><circle cx="102" cy="36" r="3.4" fill="#7dd3fc"/><path transform="translate(102 103) scale(.86) translate(-101 -102)" d="M110.5 92.5c-1.8-3.6-5.2-5.5-9.6-5.5-5.4 0-9.2 2.9-9.2 7 0 9.4 19.8 5.2 19.8 14.6 0 4.5-4.3 7.4-10.3 7.4-5.1 0-8.8-2-10.7-5.8" fill="none" stroke="url(#tkS)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span><span><b id="appNick">sTrack</b><small id="appFull">simply handle IT Track 2.1</small></span></div>
  <div class="seg" id="tabs" role="tablist" aria-label="Views">
    <button data-tab="gantt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h9M8 12h10M6 18h7"/></svg>Gantt</button>
    <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="5" height="15" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Board</button>
    <button data-tab="sprint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5v14h16"/><path d="m7 9 4 4 3-3 5 6"/></svg>Sprints</button>
    <button data-tab="time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Timesheet</button>
    <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.4c2.3.1 4 1.5 4.5 4.1"/></svg>Team</button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>Reports</button>
  </div>
  <div class="spacer"></div>

  <button id="dbPill" title="Team database"><i></i><span>Local only</span></button>

  <div class="tb">
    <button class="b ico" id="bSet" title="Project settings: calendar, holidays, name languages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg></button>
    <button class="b ico" id="bTheme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 21 9.7C21 5.9 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7" r="1.2" fill="currentColor"/></svg></button>

function burndownData(scope) {

const FL = { name: () => P.lang.a, name2: () => P.lang.b, status: 'Status', progress: 'Done %', mh: 'MH', days: 'Days', start: 'Start', pic: 'PIC', aStart: 'Actual start', aDays: 'Actual days', deps: 'After', sprint: 'Sprint', note: 'Note', type: 'Type', icon: 'Icon', level: 'Level' };
const showVal = (k, f, v) => { if (v == null || v === '') return '–'; if (f === 'pic') return (v || []).map(id => (P.members.find(m => m.id === id) || {}).name || '?').join(', ') || '–'; if (f === 'status') return STATUS[v] || v; if (f === 'deps') return (v || []).map(id => { const t = P.tasks.find(x => x.id === id); return t ? t._i + 1 : '?'; }).join(',') || '–'; if (f === 'sprint') return (P.sprints.find(s => s.id === v) || {}).name || '–'; if (typeof v === 'object') return JSON.stringify(v); return String(v); };

function openParked() {
  const list = ui.parked || [], locked = P.lock && P.lock.on;
  const m = openModal(`<div class="phead"><h2>Changes kept aside</h2><button class="xbtn" data-a="close">×</button></div>
    <p class="sub">These are changes you made after the plan was locked. They are not in the team plan. Copy them to send to whoever locked it, save them as a file, or apply them again once the plan is unlocked. Someone else's saved changes file can be applied here too.</p>
    <div class="tsel" style="max-height:40vh">${list.map(c => `<label style="cursor:default"><span>${c.k === 'dead' ? 'Deleted an item' : `<b>${esc(c.label)}</b>: ${esc(typeof FL[c.f] === 'function' ? FL[c.f]() : FL[c.f] || c.f)} ${esc(showVal(c.k, c.f, c.before))} → ${esc(showVal(c.k, c.f, c.value))}`}</span><small>${new Date(c.at).toLocaleString()}</small></label>`).join('') || '<p class="pnote" style="padding:10px">Nothing kept aside.</p>'}</div>

function applyParked(list) {

      if (!r) continue; r[c.f] = JSON.parse(JSON.stringify(c.value ?? null)); n++;
    }
  });
  ui.parked = []; persist(); closeModal(); render(); toast(`${n} change${n === 1 ? '' : 's'} applied`);
}

$('#file').addEventListener('change', e => {
  const f = e.target.files[0], mode = e.target.dataset.mode; e.target.value = ''; delete e.target.dataset.mode; if (!f) return;
  if (mode === 'import' || /\.(csv|xlsx|txt)$/i.test(f.name)) return openImport(f);
  const rd = new FileReader();
  rd.onload = () => { try { const j = JSON.parse(rd.result); if (j.kind === 'changes') { ui.parked = (ui.parked || []).concat(j.changes || []); persist(); return openParked(); } const np = normalize(j.project || j); if (DB.kind && !confirmBox('You are connected to a team database. Opening this file replaces the team plan for everyone. Continue?')) return; commit(() => { for (const k of COLL) P[k].forEach(r => { if (!np[k].some(x => x.id === r.id)) np.dead[r.id] = Date.now(); }); Object.keys(P).forEach(k => delete P[k]); Object.assign(P, np); ui.sel = null; }, false, true); toast(`Opened "${P.name}"`); } catch (err) { toast('This file is not an sTrack plan'); } };
  rd.readAsText(f);
});

/* ================= keyboard (physical keys, so Thai / Japanese layouts work) ================= */
document.addEventListener('keydown', e => {
  const typing = isTyping(), mod = e.ctrlKey || e.metaKey, modal = !$('#modal').hidden;
  if (e.key === 'Escape') { closePops(); if (modal) closeModal(); }
  if (e.key === 'F1') { e.preventDefault(); togglePop('helpPop', 'bHelp', 460, renderHelp); return; }
  if (modal) return;
  if (mod && !e.altKey) {
    const c = e.code;
    if (c === 'KeyZ' || c === 'KeyY') { if (typing && e.target.value !== e.target.defaultValue) return; e.preventDefault(); (c === 'KeyY' || e.shiftKey) ? doRedo() : doUndo(); return; }
    if (c === 'KeyS' && e.shiftKey) { e.preventDefault(); startSnip(); return; }
    if (c === 'KeyS') { e.preventDefault(); saveFile(); return; }
    if (c === 'KeyO') { e.preventDefault(); $('#file').click(); return; }
    if (c === 'KeyE') { e.preventDefault(); openCapture(); return; }
    if (c === 'Equal' || c === 'NumpadAdd') { e.preventDefault(); zoom(1); return; }
    if (c === 'Minus' || c === 'NumpadSubtract') { e.preventDefault(); zoom(-1); return; }
  }
  if (e.altKey && !mod && !e.shiftKey && ui.tab === 'gantt') {
    const map = { ArrowRight: () => shift(1), ArrowLeft: () => shift(-1), ArrowUp: () => move(-1), ArrowDown: () => move(1) };
    if (map[e.code]) { e.preventDefault(); if (typing) { captureFocus(); pendingFocus = lastFocus; } map[e.code](); }
    return;
  }
  if (e.key === 'F2' && ui.sel) { e.preventDefault(); openTask(ui.sel); return; }
  if (!typing && !mod && ui.tab === 'gantt') {
    if (e.code === 'Insert') { e.preventDefault(); addTask('task'); }
    if (e.code === 'Delete') { e.preventDefault(); delTask(); }
  }
});

/* ================= render ================= */
function setTab(k) { ui.tab = k; persist(); closePops(); render(); }
function applyTheme() { if (!THEMES[ui.theme]) ui.theme = 'basic'; document.documentElement.dataset.theme = ui.theme; }
function render() {
  if (ui.me && !P.members.some(m => m.id === ui.me)) ui.me = '';
  compute(); renderTop();
  for (const k of ['gantt', 'board', 'sprint', 'time', 'team', 'report']) $('#v' + k).hidden = ui.tab !== k;
  const lk = P.lock && P.lock.on;
  $('#bLock').classList.toggle('on', !!lk); $('#lockLbl').textContent = lk ? 'Locked' : 'Lock'; $('#bLock').title = lk ? `Locked by ${lockWho()}${P.lock.note ? ': ' + P.lock.note : ''}. Click to unlock.` : 'Lock the plan so nobody can change it';
  $('#bParked').hidden = !(ui.parked && ui.parked.length); $('#parkedN').textContent = ui.parked && ui.parked.length ? `${ui.parked.length} kept aside` : '';
  document.body.classList.toggle('locked', !!lk);
  if (ui.tab === 'gantt') { renderGantt(); if (lk || ui.cust) $$('#tlist input,#tlist select').forEach(i => i.disabled = true); paintPresence(); }
  else if (ui.tab === 'board') renderBoard(); else if (ui.tab === 'sprint') renderSprint(); else if (ui.tab === 'time') renderTime(); else if (ui.tab === 'team') renderTeam(); else renderReport();
  if (pendingFocus) { focusCell(pendingFocus); pendingFocus = null; } else if (lastFocus) focusCell(lastFocus);
  lastFocus = null;
  if (!$('#setPop').hidden) renderSet();
  renderBot();
}
function paintPresence() {
  const ed = othersEditing(); if (!ed.size) return;
  for (const [id, x] of ed) {
    const tr = document.querySelector(`.tr[data-id="${id}"]`); if (!tr) continue;
    tr.style.boxShadow = `inset 3px 0 0 ${x.color}`; tr.style.background = `color-mix(in srgb, ${x.color} 9%, transparent)`; tr.title = `${x.who} is editing this task`;
    const n = tr.querySelector('.c.n'); if (n) n.innerHTML = `<span class="av" style="background:${x.color};width:20px;height:20px;font-size:9px" title="${esc(x.who)} is editing">${esc(initials(x.who))}</span>`;
    const c = x.f && tr.querySelector(`[data-f="${x.f}"]`); if (c) c.style.boxShadow = `0 0 0 2px ${x.color}`;
  }
}

function vPreview(t, ca) {

  const rows = L.length + loose.length, W = 300, bw = 128, bh = 26, gap = 8, H = Math.max(1, rows + (B.length ? 1 : 0)) * (bh + gap) + 40, p = pal(), Y = i => 26 + i * (bh + gap);
  const box = (x, y, w, txt, c) => `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="7" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-opacity=".6"/><text x="${x + w / 2}" y="${y + 17}" font-size="10" text-anchor="middle" fill="${p.text}">${esc(cut(txt, w - 10, 5.6))}</text>`;
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" font-family="inherit"><text x="6" y="16" font-size="11" font-weight="650" fill="${p.muted}">Design</text><text x="${W - 6}" y="16" font-size="11" font-weight="650" text-anchor="end" fill="${p.muted}">Test</text>`;
  L.forEach((r, i) => { o += box(4 + i * 8, Y(i), bw, r.n[ca] || r.n.en, p.plan); });
  Rr.forEach(r => { const i = lvl.has(r.pair) ? lvl.get(r.pair) : L.length + loose.indexOf(r), x = W - 4 - bw - Math.min(i, L.length) * 8, y = Y(i); if (lvl.has(r.pair)) o += `<path d="M${4 + i * 8 + bw} ${y + bh / 2}H${x}" stroke="${p.muted}" stroke-dasharray="3 3" opacity=".8"/>`; o += box(x, y, bw, r.n[ca] || r.n.en, p.act); });
  if (B.length) o += box(W / 2 - 80, Y(rows), 160, B.map(r => r.n[ca] || r.n.en).join(', '), p.warn);
  return o + '</svg>';
}
function insertTemplate(t, ca, cb) {
  const st = parseDate(t.start); if (!st) return toast('Choose a start date');
  if (t.mode === 'replace' && P.tasks.length && !confirmBox('Replace every task in the plan? You can undo this.')) return;
  const on = []; let skipLevel = 99;
  for (const r of t.rows) { if (r.level <= skipLevel) skipLevel = 99; if (!r.on) { skipLevel = Math.min(skipLevel, r.level); continue; } if (r.level > skipLevel) continue; on.push(r); }
  if (!on.length) return toast('Tick at least one row');
  closeModal();
  commit(() => {
    let prev = 0; const made = on.map(r => { const level = Math.min(r.level, prev + 1); prev = level; return { r, t: newTask({ level, name: r.n[ca] || r.n.en || '', name2: cb !== ca ? (r.n[cb] || '') : (r.n.en || ''), type: r.type === 'ms' ? 'ms' : 'task', days: r.type === 'ms' ? 0 : Math.max(1, num(r.days) || 1), mh: r.type === 'ms' ? '' : r.mh }) }; });
    if (made.length) made[0].t.start = st;
    if (t.chain) {
      const kids = new Map(); const stack = [];
      for (const x of made) { while (stack.length && stack[stack.length - 1].t.level >= x.t.level) stack.pop(); const par = stack[stack.length - 1]; const k = par ? par.t.id : 'root'; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(x); stack.push(x); }
      for (const list of kids.values()) for (let i = 1; i < list.length; i++) list[i].t.deps = [list[i - 1].t.id];
    }
    if (t.model === 'v' && t.vlink) { const byKey = new Map(made.map(x => [x.r.key, x.t])); for (const x of made) if (x.r.side === 'R' && x.r.pair && byKey.get(x.r.pair)) x.t.deps = [...new Set([...(x.t.deps || []), byKey.get(x.r.pair).id])]; }
    if (t.mode === 'replace') { P.tasks.forEach(x => P.dead[x.id] = Date.now()); P.tasks = made.map(x => x.t); } else P.tasks = P.tasks.concat(made.map(x => x.t));
    if (isNaN(D(P.start))) P.start = st;
    ui.sel = made[0].t.id;
  });
  $('#lbody').scrollLeft = 0; toast(`${on.length} rows added. Adjust days, MH and PIC next ♪`);
  if (ui.setup && ui.setup.on && ui.setup.step === 3) { ui.setup.step = 4; persist(); render(); }
}
